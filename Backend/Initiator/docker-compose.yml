# Initiator
#
#   cp .env.example .env      # then fill in the two secrets
#   docker compose up --build
#   open http://localhost:8081
#
# Port 8081 rather than 8080 so this can run alongside LoraFleet without a
# collision.
#
# Nothing secret lives in this file. Both values below come from .env, which is
# gitignored, so the compose file itself is safe to commit and to share.

services:
  web:
    build:
      context: .
      dockerfile: src/Initiator.Web/Dockerfile
    image: initiator-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      # Double underscore is how the .NET configuration binder reads a nested
      # key out of an environment variable: MONGO__CONNECTIONSTRING becomes
      # Mongo:ConnectionString.
      MONGO__CONNECTIONSTRING: ${MONGO_CONNECTION_STRING:?set MONGO_CONNECTION_STRING in .env}
      MONGO__DATABASENAME: ${MONGO_DATABASE:-initiator}
      MONGO__LOGRETENTIONDAYS: ${LOG_RETENTION_DAYS:-30}
      MONGO__STATEEVENTRETENTIONDAYS: ${STATE_EVENT_RETENTION_DAYS:-365}

      INITIATOR__DEVICEAPIKEY: ${DEVICE_API_KEY:?set DEVICE_API_KEY in .env}
      INITIATOR__EXPECTEDREPORTPERIODSECONDS: ${EXPECTED_REPORT_PERIOD_SECONDS:-30}

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  # Optional local database, for working without touching a shared cluster.
  #   docker compose --profile local-db up
  # and point MONGO_CONNECTION_STRING at mongodb://mongo:27017 in .env.
  mongo:
    image: mongo:7
    profiles: ["local-db"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - initiator-mongo-data:/data/db

volumes:
  initiator-mongo-data:
