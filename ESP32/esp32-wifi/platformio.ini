; PlatformIO Project Configuration File
; ESP32 WiFi toolbox: scanner / repeater / 100 fake APs
; Serial-menu driven, all output on the Serial monitor.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; FTDI board is on COM4 (see project notes). Adjust if needed.
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200

; Show clean line endings in the monitor
monitor_filters = esp32_exception_decoder, default
