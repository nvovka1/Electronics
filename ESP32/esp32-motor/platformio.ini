; Back-and-forth control of a 28BYJ-48 through a ULN2003 board.
;
;   core 0 : button task - debounces the button, posts a move command
;   core 1 : motor task  - walks the coil sequence for one quarter turn
;
;   pio run -t upload -t monitor
;
; Close the serial monitor before uploading, or use -t upload -t monitor
; together - PlatformIO cannot open the port while a monitor holds it.

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
; No upload_port: PlatformIO auto-detects the board. Pinning it to a COM
; number breaks every time Windows hands out a different one.
; esp32_exception_decoder turns a panic backtrace into file:line
monitor_filters = esp32_exception_decoder, time
build_flags = -D CORE_DEBUG_LEVEL=3
