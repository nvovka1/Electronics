; LoRa Dynamic — mic board streams audio over WiFi, speaker board plays it.
;
;   pio run -e speaker -t upload     LoRa32 + SC8002B amplifier + speaker (receiver)
;   pio run -e mic -t upload         LoRa32 + INMP441 microphone (sender)
;
; Board: LILYGO/TTGO LoRa32 (ESP32-PICO-D4). Wiring is in each src file.

[platformio]
default_envs = speaker

[env]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
    kosme/arduinoFFT@^2.0.4

[env:speaker]
build_src_filter = +<speaker.cpp>

[env:mic]
build_src_filter = +<mic.cpp>
