; LoRa Morse telegraph — one codebase, two roles.
;
;   Upload the SENDER firmware to board #1:    pio run -e sender   -t upload
;   Upload the RECEIVER firmware to board #2:  pio run -e receiver -t upload
;
; (In VS Code use the PlatformIO "Project Tasks" list: each env has its own
;  Build / Upload / Monitor buttons.)

[env]
platform = espressif32
; LILYGO/TTGO LoRa32. Use the id that matches your board version:
;   ttgo-lora32-v21  (V2.1 "T3_V1.6" - most common today)
;   ttgo-lora32-v2   (V2.0)
;   ttgo-lora32-v1   (V1.0/V1.3)
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17

; Same firmware on both boards; only the node name differs.
[env:boardA]
build_flags = -D NODE_NAME=\"A\"

[env:boardB]
build_flags = -D NODE_NAME=\"B\"

