; Initiator - explosion node.
;
;   pio run -e dev     -t upload    ; bench: everything logged, test commands open
;   pio run -e field   -t upload    ; what ships: INFO and above, no test commands
;   pio test -e native              ; host unit tests, no board required
;
; The node identity is NOT a build flag: it lives in NVS, so one image serves
; every board. Set it once per board with `set node_id N`.

[platformio]
default_envs = dev

; Which fleet this node belongs to - network, service URL and API key. Kept out
; of this file because it answers a different question: everything here is about
; how the firmware is BUILT, everything there about where it will REPORT.
extra_configs = fleet.ini

; ---------------------------------------------------------------- ESP32 base
; A named section rather than [env], deliberately. Anything in [env] applies to
; EVERY environment including native, which then inherits `board` and fails with
; "Unknown board ID" - an error that says nothing about the real cause.
[esp32_base]
platform = espressif32
; LILYGO/TTGO LoRa32 v2.1 ("T3_V1.6"). Both boards in this project are this one.
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
; Without the decoder a panic from the field is just a column of addresses.
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Isrc
    -D PROTO_VERSION=1
    ; Where a factory-fresh node looks for its network and its service. These
    ; are defaults, not settings: anything stored by `set wifi`/`set url`/
    ; `set key` wins, and nothing here is ever written to NVS.
    -D NET_DEFAULT_SSID=\"${fleet.ssid}\"
    -D NET_DEFAULT_PASS=\"${fleet.password}\"
    -D NET_DEFAULT_URL=\"${fleet.base_url}\"
    -D NET_DEFAULT_KEY=\"${fleet.api_key}\"

; The host tests never build for the target.
test_ignore = test_native

; --------------------------------------------------------------------- dev
; Lives on the desk. Everything is open and everything is logged.
[env:dev]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"dev\"
    -D LOG_COMPILE_LEVEL=5
    -D LOG_TO_UART=1
    -D BUILD_TEST_COMMANDS=1

; ------------------------------------------------------------------- field
; DEBUG and TRACE are not switched off here - they are not compiled, so they
; can never switch themselves back on. INFO stays, because that is where the
; state transitions live and those are the whole point of this node.
[env:field]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"field\"
    -D LOG_COMPILE_LEVEL=3
    -D LOG_TO_UART=0
    -D BUILD_TEST_COMMANDS=0

; ------------------------------------------------------------------ native
; Host build of the pure logic in lib/: the transition table, the frame codec
; and the replay guard. A second, no board, runs in CI.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -D UNIT_TEST=1
    -D PROTO_VERSION=1
lib_compat_mode = off
