; Which fleet this node belongs to.
;
; Everything about the world outside the board lives here and nowhere else: the
; network it joins, the service it reports to, and the key it presents.
; Pointing a batch of boards at a different fleet is editing this one file.
;
; platformio.ini reads it via `extra_configs`, so a plain `pio run` picks it up
; with no extra arguments.

[fleet]

; The commissioning network. Overridable per node with `set wifi <ssid> <pass>`,
; which is how a node moves to the network it will live on.
ssid = BBC
password = liza2017

; The Initiator service. No trailing slash - the firmware strips one anyway,
; because some proxies redirect a doubled slash and others refuse it.
;
; NOT LoraFleet's URL. This is a different service with its own database.
base_url = https://initiator-70pm.onrender.com

; Must match INITIATOR__DEVICEAPIKEY in the service's environment exactly. A
; wrong key and no key produce the same 401.
;
; TWO THINGS TO KNOW ABOUT THIS VALUE
;
; 1. It is the same key ESP32/lora-queue-release/fleet.ini already carries, so
;    it is committed and has been for a while. One key now opens two services.
;    Compromising it reaches both.
;
; 2. This service is not the fleet service. It dispatches COMMANDS: anyone
;    holding this key can queue INIT, ARM, FIRE or SAFE for any enrolled node.
;    The node's own state machine limits what that achieves - a queued FIRE is
;    refused unless the node is already ARMED - but the key is doing more work
;    here than it does over there.
;
; HOW A NODE GETS A KEY. Two ways, and only two:
;
;   1. This line, compiled into the image. Convenient, and committed.
;   2. Over the cable:  > set key <key>
;      Stored in NVS, beats the compiled-in value, and never touches git.
;
; There is deliberately no build-time override from an environment variable or
; an untracked file. Both are easy to add later and neither is written yet, and
; a documented mechanism that does not exist is worse than none - somebody
; trusts it and commits a key believing it was overridden.
;
; So to rotate: change it in Render, then give each node the new value with
; `set key`, and blank this line. A value that has been in git is in every clone
; and in every copy of the history from that commit onwards; deleting the line
; does not reach back, which is why rotation is the part that matters and
; editing this file is not.
;
; With this line blank the image still builds and still runs. It just gets 401
; from every request until someone runs `set key`, and `net` says which it has.
api_key = dc779eadfe3c3801337b80f92aa32580a8586f192806c28f008e4419ba45b189
