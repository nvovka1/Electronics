; Initiator - handheld controller.
;
;   pio run -e dev     -t upload    ; bench: everything logged
;   pio run -e field   -t upload    ; what ships: no UART logging
;   pio test -e native              ; host unit tests, no board required
;
; This board has no WiFi and no fleet: it never talks to the backend, so there
; is no fleet.ini here and no API key to keep out of git. The only thing it
; needs per board is its identity, which lives in NVS - `set node_id N`.

[platformio]
default_envs = dev

; ---------------------------------------------------------------- ESP32 base
; A named section rather than [env]: anything in [env] applies to every
; environment including native, which then inherits `board` and fails with
; "Unknown board ID" - an error that says nothing about the real cause.
[esp32_base]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17

build_flags =
    -Wall
    -Isrc
    -D PROTO_VERSION=1

test_ignore = test_native

; --------------------------------------------------------------------- dev
[env:dev]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"dev\"
    -D LOG_COMPILE_LEVEL=5
    -D LOG_TO_UART=1

; ------------------------------------------------------------------- field
; No UART logging: this board lives in somebody's hand, its serial line is not
; connected to anything, and the OLED is the output that matters.
[env:field]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"field\"
    -D LOG_COMPILE_LEVEL=3
    -D LOG_TO_UART=0

; ------------------------------------------------------------------ native
; Host build of the pure logic in lib/: the sequence and the frame codec.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -D UNIT_TEST=1
    -D PROTO_VERSION=1
lib_compat_mode = off
