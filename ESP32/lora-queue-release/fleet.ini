; Which fleet these nodes belong to.
;
; Everything about the world outside the board lives here and nowhere else: the
; network it joins, the service it reports to, and the key it presents. Pointing
; a batch of boards at a different fleet is editing this one file - not hunting
; through build flags in platformio.ini, where these values used to be mixed in
; with compiler options and log levels that have nothing to do with them.
;
; platformio.ini reads it via `extra_configs`, so a plain `pio run` picks it up
; with no extra arguments.
;
; The code that consumes it is all in src/net/ - the credential store, the HTTP
; client, the reporting task and the OTA client. Nothing outside that folder
; talks to the service.
;
; NOTE ON THE VALUES BEING IN GIT
;
; They are, and for this demo fleet that is deliberate. The WiFi password
; protects one commissioning network. The API key lets you file health reports
; and read a firmware manifest against a service that holds nothing
; confidential and permits nothing destructive.
;
; When that stops being true, do not simply edit this file: put the new key in
; secrets.local.ini (gitignored - see the .example) and ROTATE it. A value that
; has been committed is in every clone and every copy of the history from that
; commit onwards, and deleting a line does not reach back.
;
; scripts/version_flags.py already prefers secrets.local.ini and the
; LORA_FLEET_API_KEY environment variable over the api_key below, so that switch
; costs nothing but the rotation itself.

[fleet]

; The commissioning network. Overridable per node with `net set ssid` /
; `net set pass`, which is how a node moves to the network it will live on.
ssid = BBC
password = liza2017

; The fleet service. No trailing slash - the firmware strips one anyway, because
; some proxies redirect a doubled slash and others simply refuse it.
base_url = https://electronics-fq9f.onrender.com

; Must match FLEET__DEVICEAPIKEY in the service's environment exactly. A wrong
; key and no key produce the same 401.
api_key = dc779eadfe3c3801337b80f92aa32580a8586f192806c28f008e4419ba45b189
