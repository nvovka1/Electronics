; LoRa Morse telegraph — one codebase, three images.
;
;   pio run -e dev     -t upload    ; bench: every log level, test commands open
;   pio run -e factory -t upload    ; conveyor: POST failure stops the board
;   pio run -e field   -t upload    ; what actually ships: WARN and above only
;
;   pio test -e native              ; host unit tests, no board required
;
; The node identity is NOT a build flag any more — it lives in NVS, so one
; image serves every board. Set it once per board with `config set node_id N`.

[platformio]
default_envs = dev

; Which fleet these nodes belong to - network, service URL and API key. Kept out
; of this file because it answers a completely different question: everything
; here is about how the firmware is BUILT, and everything there is about where
; it will REPORT. The two change for unrelated reasons and by different people.
extra_configs = fleet.ini

; ---------------------------------------------------------------- ESP32 base
[esp32_base]
platform = espressif32
; LILYGO/TTGO LoRa32. Use the id that matches your board version:
;   ttgo-lora32-v21  (V2.1 "T3_V1.6" - most common today)
;   ttgo-lora32-v2   (V2.0)
;   ttgo-lora32-v1   (V1.0/V1.3)
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
; Without the decoder a panic from the field is just a column of addresses.
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
; Version, git hash and build time come from git, never from a header.
extra_scripts =
    pre:scripts/version_flags.py
    post:scripts/release_manifest.py
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
    bblanchon/ArduinoJson@^7.2.0

; Two 1.25 MB application slots and an otadata region, which is what makes an
; over-the-air update reversible: the running image is never the one being
; written. Named explicitly rather than left to the default, because the day
; someone changes it is the day every field node stops being updatable and
; nothing says so.
board_build.partitions = default.csv

build_flags =
    -Wall
    -Isrc
    -D PROTO_VERSION=1
    ; Where a factory-fresh node looks for its network and its fleet service.
    ; The values come from fleet.ini; these lines only turn them into macros.
    ; They are defaults, not settings: anything stored by `net set` wins, and
    ; nothing here is ever written to NVS.
    -D NET_DEFAULT_SSID=\"${fleet.ssid}\"
    -D NET_DEFAULT_PASS=\"${fleet.password}\"
    -D NET_DEFAULT_URL=\"${fleet.base_url}\"
    ; The API key is deliberately NOT a -D flag here. scripts/version_flags.py
    ; emits the single -D NET_DEFAULT_KEY, choosing between the environment,
    ; secrets.local.ini and fleet.ini. Two sources for one macro is a
    ; redefinition warning and an order-dependent winner.
; The key every node presents to the fleet service, read by
; scripts/version_flags.py. The value and the reasoning live in fleet.ini.
custom_fleet_api_key = ${fleet.api_key}

; The host tests never build for the target.
test_ignore = test_native

; --------------------------------------------------------------------- dev
; Lives on the desk. Everything is open and everything is logged.
[env:dev]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"dev\"
    -D LOG_COMPILE_LEVEL=5
    -D LOG_TO_UART=1
    -D BUILD_TEST_COMMANDS=1
    -D BUILD_POST_STOPS_ON_FAIL=0

; ----------------------------------------------------------------- factory
; Lives on the conveyor. Same code, but a failed POST stops the board instead
; of degrading, and calibration/serial can be written.
[env:factory]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"factory\"
    -D LOG_COMPILE_LEVEL=4
    -D LOG_TO_UART=1
    -D BUILD_TEST_COMMANDS=1
    -D BUILD_PROVISIONING=1
    -D BUILD_POST_STOPS_ON_FAIL=1

; ------------------------------------------------------------------- field
; Lives a year in the field. DEBUG and TRACE are not switched off here —
; they are not compiled, so they can never switch themselves back on.
[env:field]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D FW_BUILD_TYPE=\"field\"
    ; INFO, not WARN. DEBUG and TRACE are still absent from this binary - that
    ; is the rule that matters and it has not changed. But INFO is where
    ; cfg_saved, wifi_up, ota_staged and ota_confirmed live, and since v1.1.0
    ; the ring log is uploaded to the fleet service rather than only read over a
    ; cable. Compiling those out means the one record that proves an update took
    ; never leaves the device.
    -D LOG_COMPILE_LEVEL=3
    -D LOG_TO_UART=0
    -D BUILD_TEST_COMMANDS=0
    -D BUILD_POST_STOPS_ON_FAIL=0

; ------------------------------------------------------------------ native
; Host build of the pure logic in lib/: frame codec, config schema and
; migrations, ring log. Two seconds, no board, runs in CI.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -D UNIT_TEST=1
    -D PROTO_VERSION=1
    -D LOG_COMPILE_LEVEL=5
lib_compat_mode = off
test_ignore =
