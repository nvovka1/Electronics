; ESP32-CAM live video — MJPEG stream served to a browser on the local WiFi.
;
;   pio run -e esp32cam -t upload
;   pio run -e esp32cam -t monitor
;
; Board: AI-Thinker ESP32-CAM (OV2640, 4 MB PSRAM).
; Before the first build, copy include/secrets.example.h to include/secrets.h
; and fill in your WiFi credentials.
;
; Flashing: the bare module has no USB. Either use the ESP32-CAM-MB USB shield,
; or a USB-serial adapter (5V->5V, GND->GND, TX->U0R, RX->U0T) with IO0 tied to
; GND while you press RESET. Remove the IO0 jumper and press RESET to run.
;
; After boot the serial monitor prints the address, e.g. http://192.168.1.50/
; (also reachable as http://esp32-camera.local/ where mDNS works).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 460800

; Camera + WiFi + HTTP server do not fit the default 1.2 MB app partition.
board_build.partitions = huge_app.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
