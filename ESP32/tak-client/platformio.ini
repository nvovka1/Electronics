; ESP32 TAK client — reports position to a TAK Server as a live contact.
;
;   pio run -e takclient -t upload
;   pio run -e takclient -t monitor
;
; Same LILYGO/TTGO LoRa32 board as the lora-morse project. LoRa is unused here;
; this firmware talks to the server over the on-board WiFi.
;
; Before the first build, copy include/config.h and fill in your WiFi
; credentials and server hostname.

[env:takclient]
platform = espressif32
; LILYGO/TTGO LoRa32 V2.1 ("T3_V1.6"). Same board id as the lora-morse project.
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17

; The OLED status display is optional. Comment this out for a headless build
; and the firmware still runs — it just logs to serial only.
build_flags =
    -D TAK_USE_OLED=1
