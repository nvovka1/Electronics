; Two FreeRTOS tasks on two different ESP32 cores, talking over a queue.
;
;   core 0 : button task  - reads the BOOT button, decides the new blink interval
;   core 1 : LED task     - blinks the on-board LED at the interval it is told
;
; The only thing that crosses between them is a BlinkCommand sent through a
; FreeRTOS queue - no shared variable is written by one task and read by the
; other.
;
;   pio run -e lora32   -t upload -t monitor
;   pio run -e esp32dev -t upload -t monitor

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; LILYGO/TTGO LoRa32 (CH9102 - COM5/COM6 here). On-board LED is GPIO 25.
[env:lora32]
board = ttgo-lora32-v21
build_flags = -D APP_LED_PIN=25

; Plain ESP32 DevKit (FTDI - COM4 here). On-board LED is GPIO 2.
[env:esp32dev]
board = esp32dev
build_flags = -D APP_LED_PIN=2
