; Part 1: two FreeRTOS tasks on two different ESP32 cores, talking over a queue.
;
;   core 0 : button task  - reads the BOOT button, decides the new blink interval
;   core 1 : LED task     - blinks the on-board LED at the interval it is told
;
; Part 2: the same firmware carries a mutex lab that is broken on purpose and is
; armed by a TRIPLE click. Which failure you get is chosen by the environment;
; the code is identical, only -D SCENARIO and the watchdog flags differ.
;
;   pio run -e lora32          -t upload -t monitor   ; deadlock, nobody watching
;   pio run -e deadlock-twdt   -t upload -t monitor   ; deadlock, Task WDT warns
;   pio run -e deadlock-panic  -t upload -t monitor   ; deadlock, Task WDT reboots
;   pio run -e starvation      -t upload -t monitor   ; Task WDT on IDLE (CPU 0)
;   pio run -e interrupt-wdt   -t upload -t monitor   ; Interrupt WDT, reboot

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; esp32_exception_decoder turns a panic backtrace into file:line
monitor_filters = esp32_exception_decoder, time

; --- Part 1 only, plus the default lab scenario -------------------------------
; LILYGO/TTGO LoRa32 (CH9102 - COM5/COM6 here). On-board LED is GPIO 25.
[env:lora32]
board = ttgo-lora32-v21
build_flags = -D APP_LED_PIN=25 -D SCENARIO=1

; --- Part 2, one environment per failure mode ---------------------------------
[lab]
board = ttgo-lora32-v21
flags = -D APP_LED_PIN=25

; Same AB/BA deadlock as in env:lora32, but the workers subscribe to the Task
; Watchdog first, so it names them every 5 s instead of saying nothing.
[env:deadlock-twdt]
board = ${lab.board}
build_flags = ${lab.flags} -D SCENARIO=1 -D WATCH_TASKS=1

; ...and with panic mode on, so the trigger calls abort() and reboots.
[env:deadlock-panic]
board = ${lab.board}
build_flags = ${lab.flags} -D SCENARIO=1 -D WATCH_TASKS=1 -D TWDT_PANIC=1

; A high-priority task busy-polls the mutex and never yields, so core 0's idle
; task is starved: the Task WDT fires on IDLE, not on our tasks.
[env:starvation]
board = ${lab.board}
build_flags = ${lab.flags} -D SCENARIO=2

; The mutex holder waits for another task from inside a critical section, with
; interrupts disabled. Only the Interrupt WDT can still run: panic + reboot.
[env:interrupt-wdt]
board = ${lab.board}
build_flags = ${lab.flags} -D SCENARIO=3
