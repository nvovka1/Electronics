; LoRa band scanner — receive-only SX1276 monitor with a joystick-driven OLED UI.
;
;   Flash the scanner:              pio run -t upload
;   Flash the wiring diagnostic:    pio run -e joystick-check -t upload
;   Watch the serial log:           pio device monitor
;
; The joystick-check env drives ONLY the OLED and the joystick, so a display or
; joystick wiring fault can be diagnosed without the radio in the picture.

[platformio]
default_envs = scanner

[env]
platform = espressif32
; LILYGO/TTGO LoRa32. Use the id that matches your board version:
;   ttgo-lora32-v21  (V2.1 "T3_V1.6" / "T3_V1.6.1" - most common today)
;   ttgo-lora32-v2   (V2.0)
;   ttgo-lora32-v1   (V1.0/V1.3)
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200

; No upload_port on purpose — this board's CP2104 bridge does not always land on
; the same COM port. Run `pio device list` if upload cannot find the board.

; The real firmware.
[env:scanner]
build_src_filter = +<*> -<diagnostics/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17

; Diagnostic: OLED + joystick only, to isolate input/display wiring faults from
; radio faults. Flash with: pio run -e joystick-check -t upload
[env:joystick-check]
build_src_filter = -<*> +<diagnostics/JoystickCheck.cpp> +<joystick.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
