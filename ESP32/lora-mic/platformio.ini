; LoRa Mic — INMP441 I2S microphone -> FFT -> OLED spectrum / waterfall.
;
;   pio run -e lora32 -t upload      the spectrum firmware
;   pio run -e pinscan -t upload     wiring finder: which pins the mic is on
;
; Board: LILYGO/TTGO LoRa32 (ESP32-PICO-D4). See src/main.cpp for wiring.

[platformio]
default_envs = lora32

[env]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
    kosme/arduinoFFT@^2.0.4

[env:lora32]
build_src_filter = +<main.cpp>

[env:pinscan]
build_src_filter = +<pin_scan.cpp>
