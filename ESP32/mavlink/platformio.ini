; MAVLink flight telemetry logger.
;
;   pio run -e esp32dev -t upload     ; flash the board
;   pio device monitor -e esp32dev    ; serial shell
;   pio test -e native                ; host tests, no board required
;
; The board identity is NOT a build flag: it lives in NVS, so one image serves
; every board. Set it once per board with `set serial <name>`.

[platformio]
default_envs = esp32dev

; Network, service URL and API key. A different question from everything in
; this file, which is only about how the firmware is BUILT.
extra_configs = fleet.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The FTDI board is on COM4 (see the repo notes). Override on the command line
; with `--upload-port` when it moves.
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
; Without the decoder a panic from the field is a column of addresses.
monitor_filters = esp32_exception_decoder, time

board_build.partitions = partitions_telemetry.csv
board_build.filesystem = littlefs

lib_deps =
    ; Header-only, and the reason this project does not hand-roll a decoder:
    ; every message carries its own CRC seed and a wrong seed looks exactly
    ; like a wiring fault.
    https://github.com/mavlink/c_library_v2.git
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Isrc
    ; c_library_v2 reads fields out of packed structs by design. The warning is
    ; correct in general and useless here, and it fires thousands of times.
    -Wno-address-of-packed-member
    ; Where a factory-fresh board looks for its network and its service.
    -D NET_DEFAULT_SSID=\"${fleet.ssid}\"
    -D NET_DEFAULT_PASS=\"${fleet.password}\"
    -D NET_DEFAULT_URL=\"${fleet.base_url}\"
    -D NET_DEFAULT_KEY=\"${fleet.api_key}\"

; The host tests never build for the target.
test_ignore = test_native

; --------------------------------------------------------------------- native
; Host build of everything in lib/: the snapshot fold, the row renderer, the
; row-to-JSON converter and the flight log. About a second, and no board.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wno-address-of-packed-member
    -D UNIT_TEST=1
    ; Latitude and longitude are doubles; without this Unity refuses to compare
    ; them and the assertion fails with "Double Precision Disabled".
    -D UNITY_INCLUDE_DOUBLE
lib_deps =
    https://github.com/mavlink/c_library_v2.git
lib_compat_mode = off
