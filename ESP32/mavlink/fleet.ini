; Where this board reports, and the network it uses to get there.
;
; Everything about the world outside the board lives here and nowhere else, so
; pointing a batch of boards at a different network or service is editing this
; one file. platformio.ini reads it via `extra_configs`, so a plain `pio run`
; picks it up with no extra arguments.
;
; Nothing here is written to NVS. These are the defaults a factory-fresh board
; falls back to; anything set with `set wifi` / `set url` / `set key` over the
; serial shell wins and survives a reflash.

[fleet]

ssid = BBC
password = liza2017

; The Initiator service. No trailing slash - the firmware strips one anyway,
; because some proxies redirect a doubled slash and others refuse it.
base_url = https://initiator-70pm.onrender.com

; Must match INITIATOR__DEVICEAPIKEY in the service's environment exactly. A
; wrong key and no key produce the same 401.
;
; The same key the initiator nodes already carry. It is committed, and it now
; opens a third door: telemetry ingest. That door is additive only - a holder
; can push rows for any aircraft serial, which is worth knowing but is not the
; same class of problem as being able to queue a FIRE.
api_key = dc779eadfe3c3801337b80f92aa32580a8586f192806c28f008e4419ba45b189
