; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload + monitor on COM4 (this board's FTDI USB-serial).
; If the port changes, run `pio device list` and update both.
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 115200        ; must match Serial.begin(115200)
monitor_filters = esp32_exception_decoder, default, time

lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
